name: Saved-run startup diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: saved-run-startup-diagnostic
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        attempt: [1, 2, 3]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: 10.33.2
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: bash e2e/install-linux-desktop.sh
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: game
          path: build/game
          run-id: 43039566955
          github-token: ${{ github.token }}
          digest-mismatch: error
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: desktop-linux-x64
          path: package-artifact
          run-id: 43039566955
          github-token: ${{ github.token }}
          digest-mismatch: error
      - name: Trace the actual packaged save boundary after the original suite prefix
        run: |
          set -euo pipefail
          node scripts/verify-game.ts build/game
          cat > storage-observer.js <<'POKEBONK_STORAGE_OBSERVER'
          (() => {
           const keys=['pb.runsave.local-sandbox','pb.runauto.local-sandbox','pokebonk.local.pending.v1','pokebonk.local.profile.v1'];
           const get=Storage.prototype.getItem,set=Storage.prototype.setItem,remove=Storage.prototype.removeItem,clear=Storage.prototype.clear;
           window.__storageStart=Object.fromEntries(keys.map(key=>[key,get.call(localStorage,key)]));window.__storageEvents=[];
           const sample=(operation,key,value)=>{if(keys.includes(key)||operation==='clear')window.__storageEvents.push({operation,key,bytes:value?.length??null,value,wall:Date.now(),stack:new Error().stack});};
           Storage.prototype.setItem=function(key,value){sample('set',key,value);return set.call(this,key,value);};
           Storage.prototype.removeItem=function(key){sample('remove',key,get.call(this,key));return remove.call(this,key);};
           Storage.prototype.clear=function(){sample('clear','*',null);return clear.call(this);};
          })();
          POKEBONK_STORAGE_OBSERVER
          cat > storage-trace.mjs <<'POKEBONK_STORAGE_TRACE'
          import {writeFileSync,mkdirSync} from 'node:fs';
          process.on('exit',()=>{mkdirSync('evidence',{recursive:true});writeFileSync('evidence/storage-save-checks.json',JSON.stringify(globalThis.__storageSaveChecks??[],null,2));});
          POKEBONK_STORAGE_TRACE
          python3 - <<'PY_INSTRUMENT'
          from pathlib import Path
          import json,tarfile,shutil
          archives=list(Path('package-artifact').glob('*.tar.gz'));assert len(archives)==1
          out=Path('packaged');out.mkdir()
          with tarfile.open(archives[0]) as archive:
              for member in archive.getmembers():
                  name=Path(member.name);assert not name.is_absolute() and '..' not in name.parts
              archive.extractall(out,filter='data')
          packages=list(out.iterdir());assert len(packages)==1
          resources=packages[0]/'resources/game'
          info=json.loads((resources/'offline-build.json').read_text())
          assert info['upstreamVersion']=='0.9.23' and info['upstreamBuild']=='mwaj5w8h' and info['offlineVersion']=='0.0.25'
          assert info['sourceDigest']=='47aea4dcf10c1f17fe0d3479badf7f6dfd14ad59de388e26bb37cc2d2bec068c'
          assert info==json.loads(Path('build/game/offline-build.json').read_text())
          shutil.copyfile('storage-observer.js',resources/'storage-probe.js')
          p=resources/'index.html';html=p.read_text();assert '<head>' in html
          p.write_text(html.replace('<head>','<head>\n<script src="storage-probe.js"></script>',1))
          source=Path('e2e/electron.ts').read_text().replace("from './run-save-checks.ts'","from './run-save-checks-storage.ts'")
          Path('e2e/electron-storage-loop.ts').write_text(source)
          checks=Path('e2e/run-save-checks.ts').read_text()
          needle='return {raw:localStorage.getItem(key),time:body.summary.time};'
          assert checks.count(needle)==1
          checks=checks.replace(needle,"return {raw:localStorage.getItem(key),time:body.summary.time,trace:{initial:window.__storageStart,events:window.__storageEvents,values:Object.fromEntries(['pb.runsave.local-sandbox','pb.runauto.local-sandbox','pokebonk.local.pending.v1','pokebonk.local.profile.v1'].map(key=>[key,localStorage.getItem(key)]))}};")
          needle='    page=await restart();'
          assert checks.count(needle)==1
          checks=checks.replace(needle,"    (globalThis.__storageSaveChecks??=[]).push({stage:'before-restart',kind,saved});\n"+needle)
          needle="    assert.equal(await page.evaluate(key=>localStorage.getItem(key),key),saved.raw,'Startup must preserve the saved blob');"
          assert checks.count(needle)==1
          checks=checks.replace(needle,"    const observed=await page.evaluate(key=>({raw:localStorage.getItem(key),trace:{initial:window.__storageStart,events:window.__storageEvents,values:Object.fromEntries(['pb.runsave.local-sandbox','pb.runauto.local-sandbox','pokebonk.local.pending.v1','pokebonk.local.profile.v1'].map(key=>[key,localStorage.getItem(key)]))}}),key);\n    (globalThis.__storageSaveChecks??=[]).push({stage:'after-restart',kind,observed});\n    assert.equal(observed.raw,saved.raw,'Startup must preserve the saved blob');")
          Path('e2e/run-save-checks-storage.ts').write_text(checks)
          PY_INSTRUMENT
          xvfb-run -a node --import ./storage-trace.mjs e2e/electron-storage-loop.ts build/game 'packaged/Pokebonk Offline-linux-x64/Pokebonk Offline'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: storage-startup-evidence-${{ matrix.attempt }}
          path: evidence/
          if-no-files-found: ignore
          retention-days: 3
          compression-level: 6
