name: Offline apps

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Compare affected domains with acquisition controls
        shell: bash
        run: |
          set -u
          for host in github.com azure.archive.ubuntu.com mirrors.edge.kernel.org archive.ubuntu.com security.ubuntu.com; do
            printf '\nDNS: %s\n' "$host"
            timeout 5 getent ahostsv4 "$host" || true
            printf '\nHTTPS: %s\n' "$host"
            curl --head --fail --silent --show-error --max-time 8 "https://$host/" || true
          done
