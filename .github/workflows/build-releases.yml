name: Offline apps

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Verify command-scoped signed mirror selection
        timeout-minutes: 6
        run: bash e2e/install-linux-desktop.sh
