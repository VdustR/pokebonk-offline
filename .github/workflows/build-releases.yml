name: Offline PWA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '41 */6 * * *'

permissions:
  contents: read

concurrency:
  group: pwa-${{ github.event.pull_request.number || 'release' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      changed: ${{ steps.identity.outputs.changed }}
      tag: ${{ steps.identity.outputs.tag }}
      build: ${{ steps.identity.outputs.build }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Check game and builder revisions
        id: identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-update.mjs
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        if: steps.identity.outputs.changed == 'true'
        with:
          version: 10.33.2
      - name: Build and verify offline PWA
        if: steps.identity.outputs.changed == 'true'
        env:
          EXPECTED_BUILD: ${{ steps.identity.outputs.build }}
        run: |
          pnpm install --frozen-lockfile
          pnpm test
          pnpm prepare:game
          node scripts/verify-game.mjs
          pnpm exec playwright-core install chromium
          pnpm e2e:pwa
          mkdir -p release
          (cd build/game && zip -qr ../../release/pokebonk-pwa.zip .)
          (cd release && sha256sum pokebonk-pwa.zip > SHA256SUMS.txt && sha256sum --check SHA256SUMS.txt)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.identity.outputs.changed == 'true'
        with:
          name: pwa
          path: release/*
          retention-days: 3
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && steps.identity.outputs.changed == 'true'
        with:
          name: evidence
          path: evidence/
          if-no-files-found: ignore
          retention-days: 3

  release:
    needs: build
    if: github.event_name != 'pull_request' && needs.build.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: pwa
          path: release
      - name: Publish verified PWA
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
          BUILD: ${{ needs.build.outputs.build }}
        run: |
          set -euo pipefail
          (cd release && sha256sum --check SHA256SUMS.txt)
          unzip -p release/pokebonk-pwa.zip offline-build.json > metadata.json
          test "$(jq -r .upstreamBuild metadata.json)" = "$BUILD"
          test "$(jq -r .builder metadata.json)" = "$GITHUB_SHA"
          cat > notes.md <<EOF
          Unofficial private PokéBonk offline PWA for game build $BUILD.

          Extract pokebonk-pwa.zip and serve it from a dedicated HTTPS origin or a localhost static server. Open it once and wait for offline preparation to finish, then install it from the browser menu. All saves stay in that browser or installed PWA.

          Includes current character, Lab, item, wardrobe and preparation unlocks. Online accounts, multiplayer and rankings are unavailable. Publication is gated on payload integrity, complete offline caching, offline reload/persistence, and representative gameplay checks. Browser storage may be evicted; physical Android/iOS device behavior is not claimed by browser automation.
          EOF
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --title "PokéBonk offline PWA $BUILD" --notes-file notes.md release/*
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
