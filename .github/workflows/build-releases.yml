name: OS storage and artifact diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: saved-run-startup-diagnostic
  cancel-in-progress: false
jobs:
  artifact-service:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - run: echo 'Public synthetic Pokebonk artifact service probe' > artifact-probe.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        timeout-minutes: 2
        with:
          name: artifact-service-smoke
          path: artifact-probe.txt
          retention-days: 3
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        attempt: [1, 2]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: 10.33.2
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: bash e2e/install-linux-desktop.sh
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: game
          path: build/game
          run-id: 43039566955
          github-token: ${{ github.token }}
          digest-mismatch: error
      - name: Build and verify the unchanged game
        run: |
          pnpm exec install-electron
          pnpm build
          node scripts/verify-game.ts build/game
      - name: Generate the OS storage driver
        run: |
          python3 - <<'PY_DRIVER'
          from pathlib import Path
          Path('e2e/electron-osstorage.ts').write_text('import {parseMetadata} from \'../types/metadata.ts\';\nimport type {ElectronApplication} from \'playwright-core\';\nimport {_electron as electron} from \'playwright-core\';\nimport {readFile,mkdtemp,rm,mkdir,writeFile,cp,access} from \'node:fs/promises\';\nimport {readdirSync,readlinkSync,statfsSync} from \'node:fs\';\nimport os from \'node:os\';\nimport path from \'node:path\';\nimport assert from \'node:assert/strict\';\nimport {checkGame,dismissMenuNotices} from \'./game-checks.ts\';\nimport {focusNativeInput} from \'./native-input-focus.ts\';\nimport {checkOfflineFriends} from \'./friends-checks.ts\';\nimport {checkRunSaves,checkCorruptRecovery} from \'./run-save-checks-osstorage.ts\';\nimport {checkEventAssets} from \'./event-checks.ts\';\nimport {checkAppearanceAssets} from \'./appearance-checks.ts\';\nimport {checkVictoryRegression} from \'./victory.ts\';\nimport {checkStellarShop} from \'./stellar-checks.ts\';\nconst game=path.resolve(process.argv[2]??\'build/game\');\nconst executablePath=process.argv[3];\nconst userData=await mkdtemp(path.join(os.tmpdir(),\'pokebonk-e2e-\'));\nconst metadata=parseMetadata(JSON.parse(await readFile(path.join(game,\'offline-build.json\'),\'utf8\')));\nconst options={env:{...process.env,POKEBONK_GAME_DIR:game,POKEBONK_USER_DATA_DIR:userData},timeout:120000,args:executablePath?[]:[\'dist/desktop/main.js\'],...(executablePath?{executablePath:path.resolve(executablePath)}:{})};\n// SwiftShader is required for headless Linux; macOS uses its native Metal backend.\nif(process.env[\'CI\'] && process.platform===\'linux\')options.args.push(\'--no-sandbox\',\'--use-gl=angle\',\'--use-angle=swiftshader\',\'--enable-unsafe-swiftshader\');\nawait mkdir(\'evidence\',{recursive:true});\nlet app: ElectronApplication | undefined;\nconst storageLifecycle:unknown[]=[{stage:\'driver-version\',version:\'os-storage-v2\'}];\nconst nativeClosures:Promise<void>[]=[];\nlet failed=false;\nfunction inspectStorageProcess(pid:number|undefined) {\n  const descriptors:string[]=[],errors:string[]=[];\n  if(process.platform===\'linux\'&&pid) {\n    try {for(const entry of readdirSync(`/proc/${pid}/fd`)) {\n      try {const target=readlinkSync(`/proc/${pid}/fd/${entry}`);if(target.includes(\'/Local Storage/\')||target.includes(\'/Session Storage/\'))descriptors.push(target);}\n      catch(error){if(typeof error!==\'object\'||error===null||!(\'code\' in error)||error.code!==\'ENOENT\')errors.push(String(error));}\n    }}catch(error){errors.push(String(error));}\n  }\n  let disk:ReturnType<typeof statfsSync>|undefined;\n  try {disk=statfsSync(userData);}catch(error){errors.push(String(error));}\n  return {pid,at:Date.now(),descriptors,errors,diskFreeBytes:disk?disk.bavail*disk.bsize:null,diskFreeInodes:disk?.ffree??null};\n}\n\n\nasync function inspectDocumentStorage(page:import(\'playwright-core\').Page) {\n  const session=await page.context().newCDPSession(page);\n  try {\n    const {frameTree}=await session.send(\'Page.getFrameTree\');\n    const {storageKey}=await session.send(\'Storage.getStorageKeyForFrame\',{frameId:frameTree.frame.id});\n    return {url:page.url(),storageKey,at:Date.now()};\n  } finally {await session.detach();}\n}\n\nconst errors: string[]=[],missing: {url:string;status:number}[]=[],external: string[]=[];\ntry {\n  await checkVictoryRegression(game,executablePath,true);\n  app=await electron.launch(options);\n  let page=await app.firstWindow();\n  if(executablePath)assert.equal(await app.evaluate(({app})=>app.getVersion()),metadata.offlineVersion,\'Packaged native version must match offline release\');\n  const isolation=await app.evaluate(({BrowserWindow})=>{\n    const window=BrowserWindow.getAllWindows()[0];\n    if(!window)throw new Error(\'No Electron window\');\n    // Electron exposes this runtime method without a public declaration.\n    const read: unknown=Reflect.get(window.webContents,\'getLastWebPreferences\');\n    if(typeof read!==\'function\')throw new Error(\'Missing Electron preferences probe\');\n    const value: unknown=read.call(window.webContents);\n    if(typeof value!==\'object\'||value===null)throw new Error(\'Invalid Electron preferences\');\n    const p=value as Record<string,unknown>;\n    return {sandbox:p[\'sandbox\'],nodeIntegration:p[\'nodeIntegration\'],contextIsolation:p[\'contextIsolation\'],webSecurity:p[\'webSecurity\']};\n  });\n  assert.deepEqual(isolation,{sandbox:true,nodeIntegration:false,contextIsolation:true,webSecurity:true});\n  const observe=(page:import(\'playwright-core\').Page)=>{\n  page.on(\'pageerror\',e=>errors.push(e.message));\n  page.on(\'response\',r=>{if(r.status()>=400)missing.push({url:r.url(),status:r.status()});});\n  page.on(\'request\',r=>{if(/^(https?|wss?):/.test(r.url()))external.push(r.url());});\n  };\n  observe(page);\n  await app.evaluate(({app,BrowserWindow})=>{app.focus({steal:true});BrowserWindow.getAllWindows()[0]?.focus();});\n  await page.waitForFunction(()=>document.hasFocus());\n  await page.waitForFunction(()=>window.__pokebonkLocalApp?.meta?.profile?.localSandbox,null,{timeout:120000});\n  await dismissMenuNotices(page);\n  await checkOfflineFriends(page);\n  await checkEventAssets(page);\n  await page.locator(\'.dk-btn\').click();\n  await page.locator(\'.dk-card .dk-ic svg\').first().waitFor({state:\'visible\'});\n  assert.equal(await page.locator(\'.dk-card .dk-ic svg\').count(),4);\n  await page.locator(\'.dk-scr img\').evaluateAll(async images=>{\n    await Promise.all(images.map(async image=>{\n      if(!(image instanceof HTMLImageElement))throw new Error(\'Invalid desktop page image\');\n      await image.decode();\n      if(!image.naturalWidth)throw new Error(\'Undecoded desktop page image: \'+image.src);\n    }));\n  });\n  assert.equal(await page.locator(\'.dk-bg\').count(),5);\n  await page.locator(\'.dk-bg\').evaluateAll(async backgrounds=>{\n    await Promise.all(backgrounds.map(async element=>{\n      const url=/^url\\(["\']?(.*?)["\']?\\)$/.exec(getComputedStyle(element).backgroundImage)?.[1];\n      if(!url)throw new Error(\'Missing desktop CSS background\');\n      const image=new Image();image.src=url;await image.decode();\n      if(!image.naturalWidth)throw new Error(\'Undecoded desktop CSS background: \'+url);\n    }));\n  });\n  await page.screenshot({path:\'evidence/electron-desktop-page.png\'});\n  await page.keyboard.press(\'Escape\');\n  await checkStellarShop(page);\n  await checkAppearanceAssets(page);\n  await checkGame(page,metadata,executablePath?\'electron-packaged\':\'electron\',{pointerLock:true,focusPointerInput:async()=>{if(!app)throw new Error(\'Missing Electron application\');await focusNativeInput(app);}});\n  const restart=async(ready=true)=>{\n    if(!app)throw Error(\'Missing native application\');\n    const nativeProcess=app.process();\n    nativeClosures.push(new Promise(resolve=>nativeProcess.once(\'close\',()=>{storageLifecycle.push({stage:\'native-process-close\',pid:nativeProcess.pid,at:Date.now(),exitCode:nativeProcess.exitCode,signalCode:nativeProcess.signalCode});resolve();})));\n    storageLifecycle.push({stage:\'before-destroy\',...inspectStorageProcess(nativeProcess.pid)});\n    await app.evaluate(({BrowserWindow})=>{for(const window of BrowserWindow.getAllWindows())window.destroy();});\n    await app.close();storageLifecycle.push({stage:\'api-close-return\',pid:nativeProcess.pid,at:Date.now(),exitCode:nativeProcess.exitCode,signalCode:nativeProcess.signalCode});app=await electron.launch(options);\n    const next=await app.firstWindow();observe(next);\n    if(ready){\n      await next.waitForFunction(()=>window.__pokebonkLocalApp?.meta?.profile?.localSandbox,null,{timeout:120000});\n      await next.locator(\'.mm-nav\').waitFor({state:\'visible\',timeout:30000});\n    }\n    return next;\n  };\n  storageLifecycle.push({stage:\'before-save-checks\',document:await inspectDocumentStorage(page).catch(error=>({captureError:String(error)}))});\n  page=await checkRunSaves(page,()=>restart(),async()=>{if(!app)throw Error(\'Missing native application\');await focusNativeInput(app);});\n  page=await checkCorruptRecovery(page,()=>restart(false));\n  assert.deepEqual(external,[]);assert.deepEqual(missing,[]);assert.deepEqual(errors,[]);\n  const gameRequests=[...external];\n  assert.equal(await page.evaluate(()=>fetch(\'https://example.com/\').then(()=>false,()=>true)),true,\'Network must be blocked\');\n  await writeFile(\'evidence/electron-network.json\',JSON.stringify({gameRequests,missing,errors,networkBlocked:true},null,2));\n  console.log(\'Electron runtime, unlocks, persistence and network isolation passed.\');\n} catch(error) {\n  failed=true;\n  if(app) {\n    try {\n    storageLifecycle.push({stage:\'after-failure\',paths:await app.evaluate(({app,session})=>({pid:process.pid,requested:process.env[\'POKEBONK_USER_DATA_DIR\'],userData:app.getPath(\'userData\'),sessionData:app.getPath(\'sessionData\'),storage:session.defaultSession.storagePath,persistent:session.defaultSession.isPersistent()})).catch(error=>({captureError:String(error)})),...inspectStorageProcess(app.process().pid)});\n    }catch(captureError){storageLifecycle.push({stage:\'failure-capture-error\',error:String(captureError)});}\n    const pages=app.windows();\n    const page=pages[0];\n    if(page) {\n      storageLifecycle.push({stage:\'failure-document\',document:await inspectDocumentStorage(page).catch(error=>({captureError:String(error)}))});\n      await page.screenshot({path:\'evidence/electron-failure.png\'}).catch(()=>{});\n      await writeFile(\'evidence/electron-failure.json\',JSON.stringify({errors,missing,external,url:page.url(),runtime:await page.evaluate(()=>({visibility:document.visibilityState,focused:document.hasFocus(),savedDialogs:document.querySelectorAll(\'.sv-card\').length,run:window.__pokebonkLocalApp?.run?{state:window.__pokebonkLocalApp.run.state,time:window.__pokebonkLocalApp.run.time}:null})).catch(()=>null),text:await page.locator(\'body\').innerText().catch(()=>\'\'),error:String(error)},null,2));\n    }\n  }\n  throw error;\n} finally {\n  if(app) {\n    // Test profiles are disposable. Bypass gameplay beforeunload dialogs so a\n    // failed assertion remains visible instead of a teardown dialog race.\n    const nativeProcess=app.process();\n    nativeClosures.push(new Promise(resolve=>nativeProcess.once(\'close\',()=>{storageLifecycle.push({stage:\'native-process-close\',pid:nativeProcess.pid,at:Date.now(),exitCode:nativeProcess.exitCode,signalCode:nativeProcess.signalCode});resolve();})));\n    storageLifecycle.push({stage:\'before-destroy\',...inspectStorageProcess(nativeProcess.pid)});\n    await app.evaluate(({BrowserWindow})=>{for(const window of BrowserWindow.getAllWindows())window.destroy();});\n    await app.close();storageLifecycle.push({stage:\'api-close-return\',pid:nativeProcess.pid,at:Date.now(),exitCode:nativeProcess.exitCode,signalCode:nativeProcess.signalCode});\n  }\n  try {\n    let allExited=false,timer:ReturnType<typeof setTimeout>|undefined;\n    try {await Promise.race([Promise.all(nativeClosures).then(()=>{allExited=true;}),new Promise(resolve=>{timer=setTimeout(resolve,10000);})]);}finally{clearTimeout(timer);}\n    storageLifecycle.push({stage:\'final-native-exit-check\',allExited});\n    await writeFile(\'evidence/storage-os-lifecycle.json\',JSON.stringify(storageLifecycle,null,2));\n    console.log(\'STORAGE_OS_LIFECYCLE\',JSON.stringify(storageLifecycle));\n    if(failed&&allExited) {\n      assert.ok(path.basename(userData).startsWith(\'pokebonk-e2e-\')&&path.dirname(userData)===os.tmpdir());\n      await mkdir(\'evidence/cold-profile\',{recursive:true});\n      for(const name of [\'Local Storage\',\'Session Storage\',\'Preferences\',\'Local State\']){\n        const origin=path.join(userData,name);\n        if(await access(origin).then(()=>true,()=>false))await cp(origin,path.join(\'evidence/cold-profile\',name),{recursive:true});\n      }\n      const raw=await readFile(\'evidence/electron-run-save-failure.json\',\'utf8\').then(JSON.parse,()=>null);\n      if(raw)console.log(\'STORAGE_OS_MISMATCH\',JSON.stringify({kind:raw.kind,beforeBytes:raw.before.raw?.length,afterBytes:raw.after.raw?.length,beforeAt:raw.before.observedAt,afterAt:raw.after.observedAt,beforeOrigin:raw.before.origin,afterOrigin:raw.after.origin,beforeCreated:JSON.parse(raw.before.profile??\'null\')?.created,afterCreated:JSON.parse(raw.after.profile??\'null\')?.created}));\n    }\n  }catch(error){console.error(\'Diagnostic OS storage capture failed:\',String(error));}\n  await rm(userData,{recursive:true,force:true});\n}\n')
          Path('e2e/run-save-checks-osstorage.ts').write_text("import type {Page} from 'playwright-core';\nimport assert from 'node:assert/strict';\nimport {writeFile} from 'node:fs/promises';\nimport {dismissMenuNotices} from './game-checks.ts';\n\nfunction readRunStorage(key:string) {\n  return {\n    observedAt:Date.now(),origin:location.origin,\n    raw:localStorage.getItem(key),\n    profile:localStorage.getItem('pokebonk.local.profile.v1'),\n    pending:localStorage.getItem('pokebonk.local.pending.v1'),\n    manual:localStorage.getItem('pb.runsave.local-sandbox'),\n    auto:localStorage.getItem('pb.runauto.local-sandbox'),\n  };\n}\n\n// Both restarts terminate the actual native process and reopen its disposable\n// profile. A renderer reload cannot prove a saved run survives process loss.\nexport async function checkRunSaves(page:Page,restart:()=>Promise<Page>,focus:()=>Promise<void>) {\n  const baseline=await page.evaluate(()=>({runs:window.__pokebonkLocalApp.meta.profile.runs.length,hold:window.__pokebonkLocalApp.meta.profile.counters['holdSecs']??0}));\n  let previousHold=baseline.hold;\n  for(const kind of ['manual','auto'] as const) {\n    await page.evaluate(()=>window.__pokebonkLocalApp.startRun({species:4,biome:'forest',tier:0,boosts:[]}));\n    await page.waitForFunction(()=>(window.__pokebonkLocalApp.run?.time??0)>3,null,{timeout:30000});\n    if(kind==='manual') {\n      await page.evaluate(()=>{const run=window.__pokebonkLocalApp.run;if(!run)throw Error('Missing run');run.input.releaseLock();run.pause();});\n      await page.waitForFunction(()=>document.pointerLockElement===null&&window.__pokebonkLocalApp.run?.state==='paused');\n      await focus();\n      await page.getByRole('button',{name:'儲存並退出',exact:true}).click();\n      await page.waitForFunction(()=>!window.__pokebonkLocalApp.run,null,{timeout:15000});\n    } else {\n      await page.evaluate(()=>{const run=window.__pokebonkLocalApp.run;if(!run)throw Error('Missing run');run.nextAuto=0;run.checkpoint();});\n      await page.waitForFunction(()=>localStorage.getItem('pb.runauto.local-sandbox')!==null,null,{timeout:15000});\n    }\n    const key=kind==='manual'?'pb.runsave.local-sandbox':'pb.runauto.local-sandbox';\n    const before=await page.evaluate(readRunStorage,key);\n    const raw:unknown=JSON.parse(before.raw??'null');\n    if(typeof raw!=='object'||raw===null||!('save' in raw)||typeof raw.save!=='string')throw Error('Missing saved run');\n    const body:unknown=JSON.parse(raw.save);\n    if(typeof body!=='object'||body===null||!('summary' in body)||typeof body.summary!=='object'||body.summary===null||!('time' in body.summary)||typeof body.summary.time!=='number')throw Error('Missing saved time');\n    const saved={raw:before.raw,time:body.summary.time};\n    page=await restart();\n    // A restarted process has a new native focus target. Establish it before\n    // sending the recovery click, as for the initial gameplay input checks.\n    await focus();\n    const after=await page.evaluate(readRunStorage,key);\n    try {\n      assert.equal(after.raw,saved.raw,'Startup must preserve the saved blob');\n    } catch(error) {\n      // These are disposable acceptance profiles. Capture the related storage\n      // only after failure so diagnostics do not delay the shutdown under test.\n      await writeFile('evidence/electron-run-save-failure.json',JSON.stringify({kind,key,before,after},null,2))\n        .catch(captureError=>console.error('Run-save failure capture failed:',captureError));\n      throw error;\n    }\n    // This resumes a scene in the same document. Verify the actual restored\n    // simulation below without waiting for an unrelated navigation.\n    await page.locator('.sv-card').getByRole('button',{name:'繼續',exact:true}).click({noWaitAfter:true});\n    const restoreStarted=Date.now();\n    // Observe the owning document and simulation together. A locator-world\n    // checkpoint can remain pending while this native scene is already restored.\n    await page.waitForFunction(()=>{const run=window.__pokebonkLocalApp.run;return !document.querySelector('.sv-card')&&run&&(run.state==='play'||run.state==='paused');},null,{timeout:90000,polling:100});\n    console.log('Native',kind,'restored scene ready after',Date.now()-restoreStarted,'ms');\n    await dismissMenuNotices(page);\n    await focus();\n    await page.evaluate(()=>window.__pokebonkLocalApp.run?.resume());\n    await page.waitForFunction(time=>(window.__pokebonkLocalApp.run?.time??0)>time+.5,saved.time,{timeout:30000});\n    const time=await page.evaluate(async()=>{\n      const app=window.__pokebonkLocalApp,run=app.run;if(!run)throw Error('Missing restored run');\n      const time=run.time;run.endHow='quit';await run.finish(false,true);app.toMenu();return time;\n    });\n    const profile=await page.evaluate(()=>window.__pokebonkLocalApp.meta.profile);\n    assert.equal(profile.runs.length,baseline.runs+(kind==='manual'?1:2));\n    const hold=profile.counters['holdSecs']??0;\n    assert.ok(Math.abs(hold-previousHold-Math.floor(time))<=1,'Recovered play time must be awarded once');\n    previousHold=hold;\n    assert.equal(await page.evaluate(()=>localStorage.getItem('pokebonk.local.pending.v1')),null);\n    assert.equal(await page.evaluate(()=>localStorage.getItem('pb.runauto.local-sandbox')),null);\n    console.log('Native',kind,'save, process restart, recovery and settlement passed');\n  }\n  page=await restart();\n  assert.equal(await page.locator('.sv-card').count(),0,'Settled saves must not be offered again');\n  assert.equal((await page.evaluate(()=>window.__pokebonkLocalApp.meta.profile)).runs.length,baseline.runs+2);\n  return page;\n}\n\nexport async function checkCorruptRecovery(page:Page,restart:()=>Promise<Page>) {\n  const before=await page.evaluate(()=>{\n    localStorage.setItem('pb.runauto.local-sandbox','{');\n    return Object.fromEntries(Object.keys(localStorage).map(key=>[key,localStorage.getItem(key)]));\n  });\n  page=await restart();\n  await page.getByRole('heading',{name:'無法載入本機遊戲資料',exact:true}).waitFor({timeout:15000});\n  await page.getByRole('button',{name:'重試',exact:true}).waitFor();\n  assert.match(await page.locator('body').innerText(),/原始資料已保留/);\n  assert.doesNotMatch(await page.locator('body').innerText(),/進度儲存在伺服器/);\n  assert.equal(await page.evaluate(()=>Boolean(window.__pokebonkLocalApp?.meta?.profile)),false);\n  assert.deepEqual(await page.evaluate(()=>Object.fromEntries(Object.keys(localStorage).map(key=>[key,localStorage.getItem(key)]))),before);\n  await page.screenshot({path:'evidence/electron-corrupt-recovery.png'});\n  console.log('Corrupt recovery blocks startup with truthful local copy and preserves all raw storage');\n  return page;\n}\n")
          import json
          p=Path('package.json');package=json.loads(p.read_text());assert package['scripts']['e2e:electron']=='pnpm build && node e2e/electron.ts';package['scripts']['e2e:electron']='pnpm build && node e2e/electron-osstorage.ts';p.write_text(json.dumps(package,indent=2)+'\n')
          PY_DRIVER
      - name: Run the full native prefix without game or logging overrides
        run: |
          set -euo pipefail
          xvfb-run -a node e2e/external-links.ts
          bash e2e/with-linux-desktop.sh pnpm repro:window-lifecycle
          bash e2e/with-linux-desktop.sh pnpm repro:fullscreen
          xvfb-run -a pnpm repro:pointer-lock
          bash e2e/with-linux-desktop.sh node e2e/fullscreen-game.ts
          xvfb-run -a node e2e/appearance-readiness.ts
          xvfb-run -a pnpm e2e:electron
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        timeout-minutes: 2
        with:
          name: storage-os-evidence-${{ matrix.attempt }}
          path: evidence/
          if-no-files-found: ignore
          retention-days: 3
          compression-level: 6
