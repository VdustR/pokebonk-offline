name: Build and verify game

on:
  workflow_call:
    inputs:
      snapshot_artifact:
        type: string
        default: ''
      publish:
        type: boolean
        default: false
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
      ANDROID_KEY_ALIAS:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false
    outputs:
      changed:
        value: ${{ jobs.prepare.outputs.changed }}
      tag:
        value: ${{ jobs.prepare.outputs.tag }}
      build:
        value: ${{ jobs.prepare.outputs.build }}
      offlineVersion:
        value: ${{ jobs.prepare.outputs.offlineVersion }}
      title:
        value: ${{ jobs.prepare.outputs.title }}
      snapshotDigest:
        value: ${{ jobs.prepare.outputs.snapshotDigest }}

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      changed: ${{ steps.identity.outputs.changed }}
      tag: ${{ steps.identity.outputs.tag }}
      build: ${{ steps.identity.outputs.build }}
      offlineVersion: ${{ steps.identity.outputs.offlineVersion }}
      title: ${{ steps.identity.outputs.title }}
      snapshotDigest: ${{ steps.identity.outputs.snapshotDigest }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: 10.33.2
      - name: Install version and inspection tools
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Read candidate snapshot
        if: inputs.snapshot_artifact != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.snapshot_artifact }}
          path: cache/upstream-candidate
      - name: Plan vendored release
        id: identity
        env:
          GH_TOKEN: ${{ github.token }}
          POKEBONK_PUBLISH: ${{ inputs.publish }}
        run: node scripts/check-update.ts '${{ inputs.snapshot_artifact != '' && 'cache/upstream-candidate' || 'vendor/pokebonk' }}'
      - name: Install native desktop test window manager
        if: steps.identity.outputs.changed == 'true'
        timeout-minutes: 6
        run: bash e2e/install-linux-desktop.sh
      - name: Validate builder
        if: steps.identity.outputs.changed == 'true'
        run: |
          pnpm exec install-electron
          pnpm typecheck
          pnpm test:types
          pnpm test
      - name: Prepare and verify offline game
        if: steps.identity.outputs.changed == 'true'
        env:
          EXPECTED_BUILD: ${{ steps.identity.outputs.build }}
        run: |
          pnpm build
          node --import ./test/no-upstream-network.ts scripts/prepare-game.ts build/game '${{ inputs.snapshot_artifact != '' && 'cache/upstream-candidate' || 'vendor/pokebonk' }}'
          node scripts/verify-game.ts
      - name: Verify native desktop behavior
        if: steps.identity.outputs.changed == 'true'
        run: |
          xvfb-run -a node e2e/external-links.ts
          bash e2e/with-linux-desktop.sh pnpm repro:window-lifecycle
          bash e2e/with-linux-desktop.sh pnpm repro:fullscreen
          xvfb-run -a pnpm repro:pointer-lock
          bash e2e/with-linux-desktop.sh node e2e/fullscreen-game.ts
          xvfb-run -a node e2e/appearance-readiness.ts
          xvfb-run -a pnpm e2e:electron
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.identity.outputs.changed == 'true'
        with:
          name: game
          path: build/game/
          compression-level: 0
          retention-days: 3
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.identity.outputs.changed == 'true'
        with:
          name: evidence
          path: evidence/
          if-no-files-found: ignore
          retention-days: 3

  desktop:
    needs: prepare
    if: needs.prepare.outputs.changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, platform: linux, arch: x64 }
          - { runner: ubuntu-24.04, platform: win32, arch: x64 }
          - { runner: macos-15, platform: darwin, arch: arm64 }
          - { runner: macos-15, platform: darwin, arch: x64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: 10.33.2
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: game
          path: build/game
      - name: Package Electron app
        run: |
          pnpm install --frozen-lockfile
          node scripts/verify-game.ts
          pnpm package:electron build/game release ${{ matrix.platform }} ${{ matrix.arch }}
      - name: Install Linux native window manager
        if: matrix.platform == 'linux'
        timeout-minutes: 6
        run: bash e2e/install-linux-desktop.sh
      - name: Test packaged Linux app
        if: matrix.platform == 'linux'
        run: |
          mkdir -p packaged
          tar -xzf release/*.tar.gz -C packaged
          bash e2e/with-linux-desktop.sh node e2e/fullscreen-game.ts build/game 'packaged/Pokebonk Offline-linux-x64/Pokebonk Offline'
          xvfb-run -a pnpm e2e:electron build/game 'packaged/Pokebonk Offline-linux-x64/Pokebonk Offline'
      - name: Test packaged native macOS app
        if: matrix.platform == 'darwin'
        run: |
          mkdir -p packaged
          ditto -x -k release/*.zip packaged
          if [[ "$(node -p process.arch)" == '${{ matrix.arch }}' ]]; then
            node e2e/fullscreen-game.ts build/game 'packaged/Pokebonk Offline-darwin-${{ matrix.arch }}/Pokebonk Offline.app/Contents/MacOS/Pokebonk Offline'
            pnpm e2e:electron build/game 'packaged/Pokebonk Offline-darwin-${{ matrix.arch }}/Pokebonk Offline.app/Contents/MacOS/Pokebonk Offline'
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.publish || inputs.snapshot_artifact == ''
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: release/*
          retention-days: 3

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: evidence-${{ matrix.platform }}-${{ matrix.arch }}
          path: evidence/
          if-no-files-found: ignore
          retention-days: 3

  android:
    needs: prepare
    if: needs.prepare.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: 10.33.2
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: game
          path: build/game
      - name: Stage and build Android
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          node scripts/verify-game.ts
          node scripts/stage-android.ts
          cd android
          ./gradlew --no-daemon -PpokebonkVersionCode="$((100000 + GITHUB_RUN_NUMBER))" -PpokebonkVersionName="${{ needs.prepare.outputs.offlineVersion }}" assembleRelease lintRelease
      - name: Sign and verify APK
        if: inputs.publish
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for key in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_PASSWORD; do
            test -n "${!key}"
          done
          keystore="$RUNNER_TEMP/pokebonk.jks"
          trap 'rm -f "$keystore"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          node scripts/sign-android.ts android/app/build/outputs/apk/release/app-release-unsigned.apk release/pokebonk-offline-${{ needs.prepare.outputs.offlineVersion }}-unlocked-android.apk "$keystore"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.publish
        with:
          name: android
          path: |
            release/*.apk
            release/*.verification.json
          retention-days: 3
