name: Offline PWA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '41 */6 * * *'

permissions:
  contents: read

concurrency:
  group: pwa-${{ github.event.pull_request.number || 'pages' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      changed: ${{ steps.identity.outputs.changed }}
      build: ${{ steps.identity.outputs.build }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Check game and builder revisions
        id: identity
        env:
          PAGES_URL: https://vdustr.github.io/pokebonk-offline/
        run: node scripts/check-update.mjs
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        if: steps.identity.outputs.changed == 'true'
        with:
          version: 10.33.2
      - name: Build and verify offline PWA
        if: steps.identity.outputs.changed == 'true'
        env:
          EXPECTED_BUILD: ${{ steps.identity.outputs.build }}
        run: |
          pnpm install --frozen-lockfile
          pnpm test
          pnpm prepare:game
          node scripts/verify-game.mjs
          pnpm exec playwright-core install chromium
          pnpm e2e:pwa
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        if: github.event_name != 'pull_request' && steps.identity.outputs.changed == 'true'
        with:
          path: build/game
          retention-days: 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && steps.identity.outputs.changed == 'true'
        with:
          name: evidence
          path: evidence/
          if-no-files-found: ignore
          retention-days: 3

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && needs.build.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy verified PWA
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
