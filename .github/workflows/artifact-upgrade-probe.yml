name: Artifact upgrade compatibility probe

on:
  push:
    branches: [codex/update-artifact-actions]
    paths: [.github/workflows/artifact-upgrade-probe.yml]

permissions:
  contents: read

jobs:
  transfer:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    steps:
      - name: Create binary and nested transfer fixtures
        shell: bash
        run: |
          mkdir -p source/game/assets source/package
          printf 'nested fixture\n' > 'source/game/assets/font name.txt'
          printf '\000\001\002\377' > source/game/assets/image.bin
          printf 'PK\005\006\000\000\000\000\000\000\000\000\000\000\000\000\000\000\000\000\000\000' > source/package/app.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: game-${{ matrix.runner }}
          path: source/game/
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ matrix.runner }}
          path: source/package/
          retention-days: 1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: game-${{ matrix.runner }}
          path: downloaded/named
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: '*-${{ matrix.runner }}'
          path: downloaded/all
      - name: Verify names, extraction layout and exact bytes
        shell: bash
        run: |
          set -euo pipefail
          test ! -d 'downloaded/named/game-${{ matrix.runner }}'
          cmp source/game/assets/image.bin downloaded/named/assets/image.bin
          cmp 'source/game/assets/font name.txt' 'downloaded/named/assets/font name.txt'
          cmp source/game/assets/image.bin 'downloaded/all/game-${{ matrix.runner }}/assets/image.bin'
          cmp 'source/game/assets/font name.txt' 'downloaded/all/game-${{ matrix.runner }}/assets/font name.txt'
          cmp source/package/app.zip 'downloaded/all/desktop-${{ matrix.runner }}/app.zip'
          echo 'Named and multiple artifacts preserved layout and binary bytes.'
